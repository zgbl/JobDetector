<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>JobDetector Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="jd-page">
      <h1>JobDetector Settings</h1>
      <p class="jd-lead">
        Automatically check whether the employer's original ATS posting is still open while you browse job pages on LinkedIn / Indeed.
      </p>

      <section class="jd-card">
        <h2>Backend</h2>
        <label class="jd-field">
          <span class="jd-label">Backend URL</span>
          <input id="backendBaseUrl" type="url" placeholder="https://jobdetector.blackrice.top" />
        </label>
        <div class="jd-inline">
          <button id="testConnection" type="button" class="jd-btn">Test connection</button>
          <span id="testResult" class="jd-test-result"></span>
        </div>
      </section>

      <section class="jd-card">
        <h2>Check behavior</h2>
        <label class="jd-switch">
          <input id="enableLinkedIn" type="checkbox" />
          <span>Enable on LinkedIn</span>
        </label>
        <label class="jd-switch">
          <input id="enableIndeed" type="checkbox" />
          <span>Enable on Indeed</span>
        </label>
        <label class="jd-switch">
          <input id="autoVerify" type="checkbox" />
          <span>Auto-verify on page load</span>
        </label>
        <label class="jd-switch">
          <input id="showGhostButton" type="checkbox" />
          <span>Show ghost-job button</span>
        </label>
        <label class="jd-field">
          <span class="jd-label">Cache TTL (hours)</span>
          <input id="cacheTtlHours" type="number" min="1" max="168" step="1" />
          <span class="jd-hint">Default 12 hours; closed / undetermined results are cached for half that time.</span>
        </label>
      </section>

      <section class="jd-card">
        <h2>Local data</h2>
        <div class="jd-inline">
          <button id="clearCache" type="button" class="jd-btn">Clear local cache</button>
          <span id="clearResult" class="jd-test-result"></span>
        </div>
      </section>

      <div class="jd-actions">
        <button id="save" type="button" class="jd-btn jd-btn--primary">Save</button>
      </div>

      <div id="toast" class="jd-toast" role="status" aria-live="polite"></div>
    </main>

    <script type="module" src="options.js"></script>
  </body>
</html>
