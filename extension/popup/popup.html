<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>JobDetector</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="jd-header">
      <div class="jd-brand">JobDetector</div>
      <div class="jd-sub">Job source check</div>
    </header>

    <main id="jd-main">
      <section id="jd-job" class="jd-section jd-hidden">
        <div id="jd-job-title" class="jd-job-title"></div>
        <div id="jd-job-company" class="jd-job-company"></div>
      </section>

      <section id="jd-status" class="jd-section">
        <div id="jd-status-badge" class="jd-badge jd-badge--loading">Checking…</div>
        <div id="jd-status-reason" class="jd-reason"></div>
        <div id="jd-status-meta" class="jd-meta"></div>
        <div class="jd-actions">
          <button id="jd-reverify" type="button" class="jd-btn jd-btn--primary">Re-check</button>
          <button id="jd-open-source" type="button" class="jd-btn">Apply at the source →</button>
        </div>
      </section>

      <section id="jd-ghost" class="jd-section">
        <button id="jd-ghost-btn" type="button" class="jd-btn jd-btn--wide">Ghost job risk analysis</button>
        <div id="jd-ghost-result" class="jd-ghost-result"></div>
      </section>

      <section id="jd-unsupported" class="jd-section jd-hidden">
        <div class="jd-empty">Open a LinkedIn / Indeed job page to check it automatically</div>
      </section>
    </main>

    <footer class="jd-footer">
      <a href="#" id="jd-options-link">Settings</a>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
