name: Daily Personal Career Digest

on:
  schedule:
    # Every day at 8:00 AM ET (12:00 UTC)
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no email sent)'
        required: false
        default: 'false'
      recipient:
        description: 'Override recipient email (leave blank to use DB settings)'
        required: false
        default: ''

jobs:
  send_digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-generativeai || true

      - name: Run Personal Digest (scheduler mode — reads recipients from DB)
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER || 'gemini' }}
        run: |
          if [ "${{ github.event.inputs.recipient }}" != "" ]; then
            # Manual override: send to specific recipient
            ARGS="--days 1 --top 15 --min-score 5 --recipient ${{ github.event.inputs.recipient }}"
          else
            # Normal schedule: read all active subscribers from DB
            ARGS="--scheduler"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python scripts/personal_digest.py $ARGS
