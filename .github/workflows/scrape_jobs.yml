name: Scheduled Job Scrape

on:
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import base companies
        id: import_base
        continue-on-error: true
        timeout-minutes: 10
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
        run: python scripts/import_companies.py

      - name: Import Ben Lang companies
        id: import_benlang
        if: always()
        continue-on-error: true
        timeout-minutes: 30
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
          run: python scripts/import_benlang.py

      - name: Run production scraper
        id: prod_scraper
        if: always()
        timeout-minutes: 300
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
        run: python scripts/prod_scraper.py

      - name: Send saved-search alerts
        id: saved_search_alerts
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        run: python scripts/send_alerts.py

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Scheduled scrape stage status"
            echo ""
            echo "| Stage | Result |"
            echo "| --- | --- |"
            echo "| Import base companies | ${{ steps.import_base.outcome }} |"
            echo "| Import Ben Lang companies | ${{ steps.import_benlang.outcome }} |"
            echo "| Production scraper | ${{ steps.prod_scraper.outcome }} |"
            echo "| Saved-search alerts | ${{ steps.saved_search_alerts.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
