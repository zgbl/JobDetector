name: User Keyword Job Alerts

on:
  schedule:
    # Run daily at 9:00 AM ET (13:00 UTC) — after scraper has run
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no emails sent)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      force:
        description: 'Force send (ignore frequency window)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      target_user:
        description: 'Run for specific user email only (leave blank for all)'
        required: false
        default: ''

jobs:
  send_keyword_alerts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Keyword Alert Engine
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          BASE_URL: ${{ secrets.BASE_URL || 'https://jobdetector.vercel.app' }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ -n "${{ github.event.inputs.target_user }}" ]; then
            ARGS="$ARGS --user ${{ github.event.inputs.target_user }}"
          fi
          python scripts/keyword_alert.py $ARGS
